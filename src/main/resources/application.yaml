spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: qa-lite

  datasource:
    url: ${QALITE_DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${QALITE_DB_USERNAME:qalite}
    password: ${QALITE_DB_PASSWORD:qalite}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${QALITE_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${QALITE_SSL_ENABLED:false}
    key-store: ${QALITE_SSL_KEYSTORE:}
    key-store-password: ${QALITE_SSL_KEYSTORE_PASSWORD:}
    key-store-type: ${QALITE_SSL_KEYSTORE_TYPE:PKCS12}
    key-alias: ${QALITE_SSL_KEY_ALIAS:qalite}
  servlet:
    context-path: /QaLite
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

logging:
  level:
    org.springframework.security: INFO
    com.mobily.qalite: INFO

qalite:
  secrets:
    encryption-key: ${QALITE_SECRET_KEY:}
