<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Lite | Login</title>
    <link rel="icon" type="image/webp" th:href="@{/images/MobilyLogo.svg.webp}">
    <link rel="preload" as="image" th:href="@{/images/login-visual.webp}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script defer th:src="@{/js/page-transition.js}"></script>
</head>
<body>
<main class="login-page" th:classappend="${param.returning != null} ? ' is-returning' : ''">
    <div class="login-visual-layer" aria-hidden="true">
        <img th:src="@{/images/login-visual.webp}" alt="" fetchpriority="high">
    </div>

    <section class="login-shell" aria-label="QA Lite login">
        <div class="login-quote">
            <span class="quote-mark">"</span>
            <p>Secure access to predefined SQL execution for QA teams.</p>
        </div>

        <section class="form-panel">
            <div class="form-copy">
                <h1>Welcome Back</h1>
                <p>Sign in to continue to the QA Lite portal</p>
            </div>

            <div id="login-error" class="alert error" th:classappend="${param.error} ? '' : ' is-hidden'" role="alert">
                Invalid username or password.
            </div>
            <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}" role="alert">
                Registration failed.
            </div>
            <div class="alert success" th:if="${param.logout}">
                You have been signed out.
            </div>
            <div class="alert success" th:if="${param.registered}">
                Account created. You can sign in now.
            </div>

            <form th:action="@{/login}" th:attr="data-success-url=@{/}" method="post" class="login-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="Username"
                    th:value="${username}" required autofocus>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>

                <button type="submit">Login</button>
                <button type="submit" class="auth-secondary-button" th:formaction="@{/register}" formmethod="post"
                    data-native-submit="true">Register</button>
            </form>
        </section>
    </section>
</main>
</body>
</html>
