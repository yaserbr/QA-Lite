<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Lite | Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="login-page">
    <div class="brand-corner">
        <div class="brand-mark">QL</div>
        <span>QA Lite</span>
    </div>

    <section class="login-shell" aria-label="QA Lite login">
        <div class="login-quote">
            <span class="quote-mark">"</span>
            <p>Secure access to predefined SQL execution for QA teams.</p>
            <span>Controlled environments. Clear history. No ad-hoc SQL.</span>
        </div>

        <section class="form-panel">
            <div class="form-copy">
                <h1>Welcome Back</h1>
                <p>Sign in to continue to the QA Lite portal</p>
            </div>

            <div class="alert error" th:if="${param.error}">
                Invalid username or password.
            </div>
            <div class="alert success" th:if="${param.logout}">
                You have been signed out.
            </div>

            <form th:action="@{/login}" method="post" class="login-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" required autofocus>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>

                <button type="submit">Login</button>
            </form>
        </section>
    </section>
</main>
</body>
</html>
