<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Lite | Dashboard</title>
    <link rel="icon" type="image/webp" th:href="@{/images/MobilyLogo.svg.webp}">
    <link rel="preload" as="image" th:href="@{/images/login-visual.webp}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script defer th:src="@{/js/page-transition.js}"></script>
</head>

<body>
    <main class="dashboard-page">
        <header class="dashboard-topbar">
            <div class="dashboard-brand">
                <img class="brand-mark brand-logo dashboard-brand-mark" th:src="@{/images/splash-icon.png}"
                    alt="Mobily logo">
                <strong>QA Lite</strong>
            </div>

            <div class="dashboard-actions">
                <a th:if="${isAdmin}" class="topbar-link" th:href="@{/admin}">Admin</a>
                <form th:action="@{/logout}" th:attr="data-login-url=@{/login(returning=true)}" method="post"
                    class="logout-form dashboard-logout">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" aria-label="Logout" title="Logout">
                        <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10 17l5-5-5-5"></path>
                            <path d="M15 12H3"></path>
                            <path d="M21 19V5a2 2 0 0 0-2-2h-6"></path>
                            <path d="M13 21h6a2 2 0 0 0 2-2"></path>
                        </svg>
                    </button>
                </form>
            </div>
        </header>

        <section class="builder-layout" aria-label="SQL execution builder">
            <aside class="env-rail" aria-label="Environments">
                <p class="section-heading">Environment</p>
                <p class="rail-empty" th:if="${#lists.isEmpty(environments)}">No environments allowed.</p>
                <button type="button" class="env-container" th:each="environment, status : ${environments}"
                    th:classappend="${status.index == 0} ? ' is-active' : ''" th:data-env="${environment.name}"
                    th:data-env-id="${environment.envId}" th:data-env-note="${environment.note}">
                    <span class="env-label" th:text="${environment.name}">SIT</span>
                    <span class="env-note" th:text="${environment.note}">Integration</span>
                </button>
            </aside>

            <section class="workspace-panel" aria-label="Workspace">
                <div class="workspace-header">
                    <div>
                        <p class="section-heading">Build execution</p>
                    </div>
                    <button type="button" class="run-button workspace-run-button" id="run-command"
                        th:data-execute-url="@{/execute}" disabled>Execute</button>
                </div>

                <div class="workflow-canvas" id="workflow-canvas">
                    <div class="workflow-empty" th:if="${activeEnvironment == null || activeCommand == null}">
                        Add access from Admin to start.
                    </div>

                    <div class="workflow-env-block" id="workflow-env-block" th:if="${activeEnvironment != null}"
                        th:data-env="${activeEnvironment.name}">
                        <span class="workflow-env-name" id="workflow-env-name"
                            th:text="${activeEnvironment.name}">SIT</span>
                        <span class="workflow-env-note" id="workflow-env-note"
                            th:text="${activeEnvironment.note}">Integration</span>
                    </div>

                    <div id="workflow-command-block" th:if="${activeCommand != null}"
                        th:class="${'workflow-command-block ' + activeCommand.tone + ' is-disconnected'}"
                        th:data-command="${activeCommand.commandId}">
                        <span class="workflow-command-title" id="workflow-command-title"
                            th:text="${activeCommand.sqlName}">Get Customer Info</span>
                        <div id="workflow-command-params" class="workflow-command-params">
                            <label class="workflow-command-input-label" th:each="paramName : ${activeCommand.parameterNames}">
                                <span th:text="${paramName}">param</span>
                                <input type="text" th:attr="data-param-name=${paramName},aria-label=${paramName}">
                            </label>
                        </div>
                    </div>
                </div>

                <section class="result-panel" aria-label="Result">
                    <p class="section-heading">Result</p>
                    <div class="result-output is-empty" id="result-output">No execution yet.</div>
                </section>
            </section>

            <aside class="command-shelf" aria-label="SQL blocks">
                <p class="section-heading">SQL Blocks</p>
                <p class="rail-empty" th:if="${#lists.isEmpty(sqlCommands)}">No SQL commands allowed.</p>
                <button type="button" class="command-block" th:each="command : ${sqlCommands}"
                    th:classappend="${command.tone}" draggable="true" th:data-command="${command.commandId}"
                    th:data-sql-id="${command.sqlId}" th:data-title="${command.sqlName}"
                    th:data-params="${command.parameterNamesJson()}">
                    <span class="block-title" th:text="${command.sqlName}">Get Customer Info</span>
                </button>
            </aside>
        </section>
    </main>
</body>

</html>
